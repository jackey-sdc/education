<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育实验平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container-fluid">
            <div class="header-content">
                <div class="logo">
                    <i class="bi bi-braces-asterisk"></i>
                    <h1>教育实验平台</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="搜索实验...">
                    </div>
                    <div class="theme-toggle">
                        <i class="bi bi-moon-stars" id="theme-toggle-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>实验目录</h3>
            </div>
            <nav class="sidebar-nav">
                <div class="category">
                    <div class="category-header">
                        <i class="bi bi-stars"></i>
                        <span>天文实验</span>
                    </div>
                    <ul class="category-items">
                        <li class="nav-item" data-path="stars/index.html">
                            <i class="bi bi-globe"></i>
                            <span>太阳系3D模拟</span>
                        </li>
                    </ul>
                </div>
                <div class="category">
                    <div class="category-header">
                        <i class="bi bi-mortarboard"></i>
                        <span>小学教育</span>
                    </div>
                    <ul class="category-items">
                        <li class="nav-item" data-path="primary/clock/clock.html">
                            <i class="bi bi-clock"></i>
                            <span>时钟学习</span>
                        </li>
                        <li class="nav-item" data-path="primary/ball_collision/ball_collision.html">
                            <i class="bi bi-circle"></i>
                            <span>球体碰撞实验</span>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>© 2025 教育实验平台</p>
            </div>
        </aside>

        <!-- 右侧内容区域 -->
        <main class="content">
            <div class="content-header">
                <h2 id="content-title">欢迎使用教育实验平台</h2>
                <div class="content-actions">
                    <button class="btn btn-sm btn-outline-primary" id="fullscreen-btn">
                        <i class="bi bi-arrows-fullscreen"></i> 全屏
                    </button>
                </div>
            </div>
            <div class="content-body">
                <iframe id="content-frame" src="welcome.html" frameborder="0"></iframe>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
