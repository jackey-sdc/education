<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用教育实验平台</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .welcome-container {
            max-width: 800px;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            animation: fadeIn 1.5s ease-in-out;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: #555;
            animation: slideUp 1.5s ease-in-out;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }
        .feature {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            padding: 1.5rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 1.5s ease-in-out;
        }
        .feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        .feature i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #3498db;
        }
        .feature h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            color: #2c3e50;
        }
        .feature p {
            font-size: 1rem;
            color: #666;
        }
        .cta-button {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background-color: #3498db;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.3s ease;
            animation: fadeIn 2s ease-in-out;
        }
        .cta-button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 暗色模式支持 */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #f0f0f0;
            }
            h1 {
                color: #e0e0e0;
            }
            p {
                color: #c0c0c0;
            }
            .feature {
                background-color: #2a2a2a;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }
            .feature h3 {
                color: #e0e0e0;
            }
            .feature p {
                color: #b0b0b0;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="welcome-container">
        <h1>欢迎使用教育实验平台</h1>
        <p>这是一个集成了多种教育实验的交互式平台，旨在通过可视化和互动的方式帮助学习者理解各种科学概念。</p>
        
        <div class="features">
            <div class="feature">
                <i class="bi bi-stars"></i>
                <h3>天文实验</h3>
                <p>探索宇宙奥秘，通过3D模拟了解太阳系行星运动规律。</p>
            </div>
            <div class="feature">
                <i class="bi bi-clock"></i>
                <h3>时间学习</h3>
                <p>通过交互式时钟，帮助小学生理解时间概念和时钟读数。</p>
            </div>
            <div class="feature">
                <i class="bi bi-circle"></i>
                <h3>物理碰撞</h3>
                <p>模拟多球碰撞实验，直观展示动量守恒和能量守恒原理。</p>
            </div>
        </div>
        
        <p>从左侧导航栏选择一个实验开始探索吧！</p>
    </div>
</body>
</html>
