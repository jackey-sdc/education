<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系3D模拟</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    .planet-info {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        display: none;
    }
    .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        font-size: 18px;
        z-index: 1000;
    }
    </style>
</head>
<body>
    <div class="info">
        <h2>太阳系3D模拟</h2>
        <p>鼠标拖动: 旋转视角</p>
        <p>鼠标滚轮: 缩放</p>
        <p>点击行星查看详情</p>
    </div>
    <div class="controls">
        <label>
            <input type="checkbox" id="autoRotate" checked> 自动旋转
        </label>
        <label>
            <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1"> 速度: <span id="speedValue">1.0</span>
        </label>
    </div>
    <div class="planet-info" id="planetInfo"></div>
    <div class="loading" id="loading">正在加载行星纹理...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="solar-system.js"></script>
</body>
</html>
